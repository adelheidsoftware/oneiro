# StyLua settings for the Lua Oneiro writes (see "The Lua style" in CONTRIBUTING.md). The conformance suite checks its
# expected Lua with StyLua 2.6.0 and these settings; StyLua is not part of Oneiro.
syntax = "Lua54"
column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
space_after_function_names = "Never"

[sort_requires]
enabled = false
