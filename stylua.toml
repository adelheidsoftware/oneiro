# StyLua settings matching the plugin house style (docs/04-lua-style.md in the workspace). StyLua checks Oneiro's
# expected and generated Lua in the conformance suite; it is never shipped.
syntax = "Lua54"
column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
space_after_function_names = "Never"

[sort_requires]
enabled = false
